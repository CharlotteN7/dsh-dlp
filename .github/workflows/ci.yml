name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build and unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4
      # A path or hostname committed once stays retrievable through `git show`
      # even after it leaves HEAD; only a history rewrite takes it back.
      - name: No local paths or machine names
        run: ./scripts/check-no-local-paths.sh --tree

      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # 100% per-file coverage is the bar for this package: it is a security
      # control, and an untested branch in a deny path is an unproven deny path.
      - name: Unit tests with coverage
        run: pnpm run test:coverage

  e2e:
    name: end-to-end against a real harness (dsh ${{ matrix.dsh }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every published rc the peer ranges admit, each pinned exactly: the npm
        # `latest` dist-tag for most @deepseek-ai/dsh-* packages still points at
        # 0.0.1-rc.1, so a floating range would silently resolve to ancient code.
        # A new rc is added here, and the leg that fails names the version that
        # broke. The 0.1.2 alpha line the ranges also admit is not driven here —
        # the `alpha` job below typechecks and builds against it instead.
        dsh: ['0.1.0-rc.6', '0.1.0-rc.7', '0.1.0-rc.8', '0.1.1-rc.1', '0.1.1-rc.2']
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # The published CLI, not a monorepo checkout: it needs no source build and
      # resolves its own bundles. `autoInstallPeers` is required because
      # @deepseek-ai/dsh-app-boot declares the vendored cordis plugins as
      # non-optional peers; without it boot dies on a missing
      # @deepseek-ai/cordis-plugin-group. `nodeLinker: hoisted` is what dsh's own
      # profiles use, and the build approvals cover its native dependencies.
      - name: Install the published dsh CLI
        env:
          DSH_VERSION: ${{ matrix.dsh }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-cli"
          cd "$RUNNER_TEMP/dsh-cli"
          cat > package.json <<'JSON'
          { "name": "dsh-cli-host", "private": true, "type": "module" }
          JSON
          cat > pnpm-workspace.yaml <<'YAML'
          packages:
            - .
          nodeLinker: hoisted
          autoInstallPeers: true
          allowBuilds:
            '@deepseek-ai/dsh-subprocess-local': true
            node-pty: true
            koffi: true
            protobufjs: true
            '@google/genai': true
          YAML
          pnpm add -D "@deepseek-ai/dsh@${DSH_VERSION}"
          test -f node_modules/@deepseek-ai/dsh/lib/bin.js

      # Keyless. The mock speaks the OpenAI wire protocol, so the provider
      # adapter, agent loop, tool pipeline, guards and persistence are all real.
      - name: End-to-end tests
        env:
          DSH_CLI: ${{ runner.temp }}/dsh-cli/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: pnpm run test:e2e

  alpha:
    name: typecheck against the 0.1.2 prerelease line
    runs-on: ubuntu-latest
    # An early warning about upstream's next line, not a gate on this one. It
    # resolves a moving dist-tag against a registry we do not control, so it can
    # fail for reasons that have nothing to do with this package - pnpm's
    # minimum-release-age holds back a prerelease published hours earlier, and
    # the tag then resolves to nothing. A red run here would say "this release
    # is broken" about code that passes every supported version, which is how a
    # team learns to ignore red CI.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The peer ranges admit the 0.1.2 prereleases, and the break they carry is
      # a type move rather than a runtime fault: `JsonValue` left
      # @deepseek-ai/dsh-session for @deepseek-ai/dsh-util-values in
      # 0.1.2-alpha.2, and no end-to-end leg would have seen it. The `alpha`
      # dist-tag rather than a pin, because the point is the newest prerelease.
      - name: Resolve the harness packages at the alpha dist-tag
        run: |
          set -euo pipefail
          # `--config.minimumReleaseAge=0`: pnpm 11 withholds a package published
          # inside its release-age window, and the whole point of this job is
          # the newest prerelease. Without it the tag resolves to nothing hours
          # after upstream publishes, which is exactly when it is worth running.
          pnpm add -D --config.minimumReleaseAge=0 \
            "@deepseek-ai/dsh-llm@alpha" "@deepseek-ai/dsh-session@alpha" \
            "@deepseek-ai/dsh-session-telemetry@alpha" "@deepseek-ai/dsh-tools@alpha"

      - run: pnpm run typecheck
      - run: pnpm run build

  package:
    name: package integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: publint
        run: pnpm dlx publint --strict

      # This package once published 1 of its 9 modules because `files` listed the
      # entry point literally. Assert every built module is actually shipped.
      - name: Every built module is published
        run: |
          set -euo pipefail
          pnpm pack --pack-destination /tmp > /dev/null
          tarball="$(ls /tmp/dsh-dlp-*.tgz)"
          built="$(find lib -name '*.js' | wc -l)"
          shipped="$(tar tzf "$tarball" | grep -cE '^package/lib/.*\.js$')"
          echo "built=$built shipped=$shipped"
          if [ "$built" -ne "$shipped" ]; then
            echo "::error::$built modules built but $shipped published - check the files field"
            tar tzf "$tarball" | grep '^package/lib/' || true
            exit 1
          fi
